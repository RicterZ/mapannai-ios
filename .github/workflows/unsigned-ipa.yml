name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unsigned-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Report build toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Install XcodeGen
        run: brew list xcodegen || brew install xcodegen
      - name: Download official map SDK
        run: python3 Scripts/fetch-sdk.py
      - name: Configure native map key
        env:
          AMAP_IOS_KEY: ${{ secrets.AMAP_IOS_KEY }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          key = os.environ.get('AMAP_IOS_KEY', '').strip()
          if not re.fullmatch(r'[A-Za-z0-9]+', key):
              raise SystemExit('Configure the AMAP_IOS_KEY repository secret before building')
          pathlib.Path('Config/Local.xcconfig').write_text('AMAP_IOS_KEY = ' + key + '\n')
          PY
      - name: Build and package unsigned device app
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            export RELEASE_VERSION="${REF_NAME#v}"
          fi
          Scripts/build-unsigned-ipa.sh dist
      - name: Remove local key configuration
        if: always()
        run: rm -f Config/Local.xcconfig
      - uses: actions/upload-artifact@v4
        with:
          name: MapAnNai-unsigned-${{ github.sha }}
          path: |
            dist/*.ipa
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MapAnNai-unsigned-${{ github.sha }}
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/*.ipa dist/*.sha256 \
            --verify-tag --title "${RELEASE_TAG#v}" --notes-file docs/release-notes.md
