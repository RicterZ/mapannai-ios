name: MapAnNai
options:
  bundleIdPrefix: me.mapannai
  deploymentTarget:
    iOS: '17.0'
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: MapAnNai
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 在你点击定位时，在地图上显示当前位置。
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 选择图片，为地点添加照片。
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: 连接你配置的局域网 MapAnNai 服务。
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    MARKETING_VERSION: 0.0.1
    CURRENT_PROJECT_VERSION: 139
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_OBJC_BRIDGING_HEADER: App/MapAnNai-Bridging-Header.h
    FRAMEWORK_SEARCH_PATHS: '$(inherited) $(PROJECT_DIR)/Vendor'
    'OTHER_LDFLAGS[sdk=iphoneos*]': '$(inherited) -ObjC -framework MAMapKit -framework AMapFoundationKit -framework CoreTelephony -framework SystemConfiguration -framework Security -framework OpenGLES -framework GLKit -lz -lc++'
packages:
  GoogleMaps:
    url: https://github.com/googlemaps/ios-maps-sdk
    exactVersion: 11.2.0
targets:
  MapAnNai:
    type: application
    platform: iOS
    sources:
      - App
      - Core
      - Map
      - Views
      - path: Vendor/MAMapKit.framework/AMap.bundle
        buildPhase: resources
        type: file
    dependencies:
      - package: GoogleMaps
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: me.mapannai.ios
        INFOPLIST_FILE: App/Info.plist
  MapAnNaiTests:
    type: bundle.unit-test
    platform: iOS
    sources: Tests
    dependencies:
      - target: MapAnNai
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: ''
  MapAnNaiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: UITests
    dependencies:
      - target: MapAnNai
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: ''
schemes:
  MapAnNai:
    build:
      targets:
        MapAnNai: all
        MapAnNaiTests: [test]
        MapAnNaiUITests: [test]
    test:
      targets:
        - MapAnNaiTests
        - MapAnNaiUITests
